name: CI

# WP-CQ-01 — the Frontend repo previously had NO CI (only Vercel's build gate).
# This runs the fast static checks + unit tests on every PR/main push, so a
# type/lint/test regression is caught before it reaches the Vercel build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # version omitted — action reads packageManager from package.json (pnpm@10.8.1).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm --filter @shopping-assistant/web test
